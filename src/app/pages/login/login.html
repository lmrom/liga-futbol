<section class="campo campo--negro acceso">
  <div class="acceso__texto">
    <p class="titulillo aparece">Acceso privado</p>
    <h1 class="rotulo rotulo--l"><span class="sube"><span>Entrar</span></span></h1>
    <p class="parrafo aparece" [style.--i]="2">
      Solo para la administración y las delegadas de equipo. Aquí se cuidan los datos personales de las jugadoras.
    </p>
  </div>

  <form class="acceso__forma aparece" [style.--i]="3" (ngSubmit)="entrar()">
    @if (error()) {
      <p class="fallo" role="alert">{{ error() }}</p>
    }
    <label>
      <span class="mono">Correo</span>
      <input type="email" name="correo" autocomplete="username" [(ngModel)]="correo" required>
    </label>
    <label>
      <span class="mono">Contraseña</span>
      <input type="password" name="password" autocomplete="current-password" [(ngModel)]="password" required>
    </label>
    <button class="boton boton--amarillo"><span>Entrar</span><i></i></button>
  </form>
</section>
