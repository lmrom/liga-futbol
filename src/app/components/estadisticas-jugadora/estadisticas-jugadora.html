<dl class="datos">
  @for (d of datos(); track d.texto) {
    <div class="dato" [class]="d.tono ? 'dato dato--' + d.tono : 'dato'">
      <dt class="mono">{{ d.texto }}</dt>
      <dd class="rotulo" [style.--cifras]="('' + d.valor).length" [appContador]="d.valor" [duracion]="900">0</dd>
    </div>
  }
</dl>

<h3 class="titulillo equipos__titulo">Equipos</h3>
<div class="tabla-caja">
  <table class="tabla">
    <thead>
      <tr>
        <th class="izq">Temporada</th><th class="izq">Equipo</th>
        @if (!publico()) { <th>Playera</th> }
        <th>Posición</th>
      </tr>
    </thead>
    <tbody>
      @for (e of stats().equipos; track $index) {
        <tr>
          <td class="izq mono">{{ e.temporada }}</td>
          <td class="izq equipo">{{ e.equipo }} @if (e.fecha_baja) { <span class="sello sello--tinta">Baja</span> }</td>
          @if (!publico()) { <td>{{ e.dorsal ?? '—' }}</td> }
          <td class="mono">{{ e.posicion ?? '—' }}</td>
        </tr>
      }
    </tbody>
  </table>
</div>
